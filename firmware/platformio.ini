; WRAITH Nano — PlatformIO project (ESP-IDF framework, no Arduino).
;
; BOARD: identified 2026-11-11 as ESP32-D0WD-V3 rev 3.1, 40 MHz crystal,
; 4 MB flash, CP2102 USB-UART -> "esp32dev" (4 MB) matches. docs/hardware.md.

[platformio]
default_envs = wraith-nano

[env:wraith-nano]
platform = espressif32
board = esp32dev
framework = espidf

monitor_speed = 115200
monitor_filters = direct
; 460800 baud transfers fail on this board's USB-UART link ("Packet content
; transfer stopped"); 115200 is reliable.
upload_speed = 115200

build_flags =
    -D WRAITH_FIRMWARE
    -D WRAITH_PROTOCOL_VERSION=3
    -Wall
    -Wextra
    -Wno-unused-parameter

; Same build with deauth test transmission compiled in (docs/tx.md).
; Authorized-networks-only feature: flash this env only if that applies to you.
;   pio run -e tx -t upload
[env:tx]
extends = env:wraith-nano
build_flags =
    ${env:wraith-nano.build_flags}
    -D WRAITH_TX_ENABLED=1
; No cooldown between bursts, for continuous authorized testing. Remove this
; line (or set another value) to restore the 30 s default.
    -D WRAITH_TX_COOLDOWN_MS=0
; tx_raw_override.c replaces the driver's raw-frame sanity check (it rejects
; deauth frames). Both symbols are strong, so let the app definition win.
    -Wl,--allow-multiple-definition

; Host-side unit tests for the hardware-independent modules
; (protocol serializer, JSON writer, 802.11 frame parser).
; Run with: pio test -e native
; Without PlatformIO: ../scripts/firmware-host-tests.sh
[env:native]
platform = native
test_build_src = no
build_flags =
    -I include
    -D WRAITH_HOST_TEST
    -D WRAITH_PROTOCOL_VERSION=3
build_src_filter = -<*>
